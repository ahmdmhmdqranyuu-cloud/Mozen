name: Android CI Test & Verification

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  verify:
    name: Verify Android Compilation and Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Licenses & Install Android SDK Components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "cmdline-tools;latest" "platform-tools" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" || true

      - name: Grant execute permission for gradlew
        run: |
          chmod +x gradlew android/gradlew || true

      - name: Run Android Unit Tests & Lint
        run: |
          ./gradlew testDebugUnitTest --stacktrace
