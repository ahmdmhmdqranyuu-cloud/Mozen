name: Android CI Test & APK Verification

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  verify:
    name: Verify Android & Wear OS Unit Tests, Lint & Debug APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle & Android Wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-ci-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle.properties') }}
          restore-keys: |
            gradle-ci-${{ runner.os }}-

      - name: Set up Android SDK 36 (Command-line Tools only, no legacy tools)
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            SDK_ROOT="$HOME/android-sdk"
            mkdir -p "$SDK_ROOT"
          fi
          if [ ! -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -fsSL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
            unzip -q -o /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-extract
            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            mv /tmp/cmdline-tools-extract/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            rm -rf /tmp/cmdline-tools.zip /tmp/cmdline-tools-extract
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          set -o pipefail
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Grant execute permission for gradlew
        run: |
          chmod +x gradlew android/gradlew

      - name: Run Unit Tests, Strict Lint & Build Debug APKs (:app + :wear with HTTP 429 Retry)
        working-directory: android
        run: |
          MAX_ATTEMPTS=4
          BACKOFF_SEC=15
          ATTEMPT=1
          SUCCESS=false
          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            echo "=== Gradle attempt $ATTEMPT/$MAX_ATTEMPTS ==="
            if ./gradlew :app:testDebugUnitTest :wear:testDebugUnitTest lint :app:assembleDebug :wear:assembleDebug --stacktrace \
              -Dorg.gradle.internal.repository.max.retries=6 \
              -Dorg.gradle.internal.repository.initial.backoff=2000; then
              SUCCESS=true
              break
            fi
            if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
              echo "::warning::Gradle build failed (attempt $ATTEMPT/$MAX_ATTEMPTS). Waiting ${BACKOFF_SEC}s before retry in case of Maven HTTP 429 or transient network error..."
              sleep "$BACKOFF_SEC"
              BACKOFF_SEC=$((BACKOFF_SEC * 2))
            fi
            ATTEMPT=$((ATTEMPT + 1))
          done
          ./gradlew --stop || true
          if [ "$SUCCESS" != "true" ]; then
            echo "Error: Gradle failed after $MAX_ATTEMPTS attempts."
            exit 1
          fi

      - name: Verify Debug APKs Alignment & Signature
        run: |
          APP_DEBUG_APK=$(find android/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)
          WEAR_DEBUG_APK=$(find android/wear/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)
          for APK in "$APP_DEBUG_APK" "$WEAR_DEBUG_APK"; do
            if [ -z "$APK" ] || [ ! -s "$APK" ]; then
              echo "Error: Debug APK was not generated."
              exit 1
            fi
            ls -lh "$APK"
            "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" >/tmp/badging-ci.log || {
              cat /tmp/badging-ci.log
              exit 1
            }
            head -n 5 /tmp/badging-ci.log
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$APK" >/tmp/zipalign-ci.log || {
              tail -n 25 /tmp/zipalign-ci.log
              exit 1
            }
            tail -n 5 /tmp/zipalign-ci.log
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          done

      - name: Upload CI Debug APKs
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AlMoazen-CI-Debug-APKs
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/wear/build/outputs/apk/debug/*.apk
          if-no-files-found: error
