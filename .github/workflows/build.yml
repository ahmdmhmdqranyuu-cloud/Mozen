name: Android & Wear OS Release Build

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_aab:
        description: 'Build Play Store App Bundle (AAB) in addition to Release APKs'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

concurrency:
  group: android-build-yml-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-debug:
    name: Unit Tests, Lint & Debug APKs (App + Wear OS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle & Android Wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-build-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle.properties') }}
          restore-keys: |
            gradle-build-${{ runner.os }}-

      - name: Set up Android SDK 36 & Build Tools 36.0.0
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            SDK_ROOT="$HOME/android-sdk"
            mkdir -p "$SDK_ROOT"
          fi
          if [ ! -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -fsSL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
            unzip -q -o /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-extract
            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            mv /tmp/cmdline-tools-extract/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            rm -rf /tmp/cmdline-tools.zip /tmp/cmdline-tools-extract
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          set -o pipefail
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew android/gradlew

      - name: Run Unit Tests, Lint & Debug APKs (with HTTP 429 Retry)
        working-directory: android
        run: |
          MAX_ATTEMPTS=4
          BACKOFF_SEC=15
          ATTEMPT=1
          SUCCESS=false
          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            echo "=== Gradle Debug build attempt $ATTEMPT/$MAX_ATTEMPTS ==="
            EXTRA_FLAGS=""
            if [ "$ATTEMPT" -gt 1 ]; then
              EXTRA_FLAGS="--refresh-dependencies"
            fi
            if ./gradlew :app:testDebugUnitTest :wear:testDebugUnitTest lint :app:assembleDebug :wear:assembleDebug --stacktrace $EXTRA_FLAGS \
              -Dorg.gradle.internal.repository.max.retries=6 \
              -Dorg.gradle.internal.repository.initial.backoff=2000; then
              SUCCESS=true
              break
            fi
            if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
              echo "::warning::Gradle failed (attempt $ATTEMPT/$MAX_ATTEMPTS). Waiting ${BACKOFF_SEC}s before retry..."
              sleep "$BACKOFF_SEC"
              BACKOFF_SEC=$((BACKOFF_SEC * 2))
            fi
            ATTEMPT=$((ATTEMPT + 1))
          done
          ./gradlew --stop || true
          if [ "$SUCCESS" != "true" ]; then
            echo "::error::Unit tests, lint, or Debug build failed after $MAX_ATTEMPTS attempts."
            exit 1
          fi

      - name: Upload Debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: MuslimPlus-Debug-APKs
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/wear/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  build-release:
    name: Build & Verify Release APKs + AAB (App + Wear OS)
    needs: verify-and-debug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle & Android Wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-build-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle.properties') }}
          restore-keys: |
            gradle-build-${{ runner.os }}-

      - name: Set up Android SDK 36 & Build Tools 36.0.0
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            SDK_ROOT="$HOME/android-sdk"
            mkdir -p "$SDK_ROOT"
          fi
          if [ ! -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -fsSL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
            unzip -q -o /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-extract
            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            mv /tmp/cmdline-tools-extract/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            rm -rf /tmp/cmdline-tools.zip /tmp/cmdline-tools-extract
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          set -o pipefail
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew android/gradlew

      - name: Prepare Release Signing Keystore (Official Secrets or Auto-Generated Release Key)
        env:
          SECRET_KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          SECRET_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p "$HOME/.android"
          KEYSTORE_OUT="$HOME/.android/release.keystore"

          if [ \( -n "${SECRET_KEYSTORE_FILE:-}" -o -n "${SECRET_KEYSTORE_BASE64:-}" \) \
            -a -n "${KEYSTORE_PASSWORD:-}" \
            -a -n "${KEY_ALIAS:-}" \
            -a -n "${KEY_PASSWORD:-}" ]; then
            echo "Detected official Release keystore secrets — decoding and validating..."
            if [ -n "${SECRET_KEYSTORE_FILE:-}" ] && [ -f "$SECRET_KEYSTORE_FILE" ]; then
              cp "$SECRET_KEYSTORE_FILE" "$KEYSTORE_OUT"
            else
              export RAW_KS_PAYLOAD="${SECRET_KEYSTORE_FILE:-${SECRET_KEYSTORE_BASE64:-}}"
              export KEYSTORE_OUT
              python3 -c 'import base64, os, re; raw = os.environ["RAW_KS_PAYLOAD"].strip(); raw = raw.split(";base64,", 1)[1] if raw.startswith("data:") and ";base64," in raw else raw; cleaned = re.sub(r"\s+", "", raw); cleaned += "=" * ((-len(cleaned)) % 4); open(os.environ["KEYSTORE_OUT"], "wb").write(base64.urlsafe_b64decode(cleaned) if ("-" in cleaned or "_" in cleaned) else base64.b64decode(cleaned, validate=False))'
            fi

            keytool -list -v -keystore "$KEYSTORE_OUT" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
            echo "KEYSTORE_FILE=$KEYSTORE_OUT" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "SIGNING_MODE_LABEL=Official Keystore" >> "$GITHUB_ENV"
          else
            echo "::notice::No repository keystore secrets configured — generating ephemeral per-run Release PKCS12 keystore (no credentials stored in repository)."
            CI_KS="$HOME/.android/ci-release.keystore"
            CI_PASS="$(openssl rand -hex 24)"
            echo "::add-mask::$CI_PASS"
            CI_ALIAS="muslimplus_ci"
            rm -f "$CI_KS"
            keytool -genkeypair -v -noprompt \
              -keystore "$CI_KS" \
              -storetype PKCS12 \
              -storepass "$CI_PASS" \
              -alias "$CI_ALIAS" \
              -keypass "$CI_PASS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Muslim Plus, OU=Mobile, O=Muslim Plus, L=Makkah, C=SA"
            echo "KEYSTORE_FILE=$CI_KS" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$CI_PASS" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$CI_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$CI_PASS" >> "$GITHUB_ENV"
            echo "SIGNING_MODE_LABEL=Auto-Generated CI Release Keystore" >> "$GITHUB_ENV"
          fi

      - name: Print Build Diagnostics & Build Release APKs + AAB (with HTTP 429 Retry)
        working-directory: android
        run: |
          GRADLE_TASKS=":printBuildEnvironment :app:printSigningEnv :wear:printSigningEnv :app:assembleRelease :wear:assembleRelease"
          if [ "${{ inputs.build_aab }}" != "false" ]; then
            GRADLE_TASKS="$GRADLE_TASKS :app:bundleRelease"
          fi

          MAX_ATTEMPTS=4
          BACKOFF_SEC=15
          ATTEMPT=1
          SUCCESS=false
          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            echo "=== Gradle Release build attempt $ATTEMPT/$MAX_ATTEMPTS ==="
            EXTRA_FLAGS=""
            if [ "$ATTEMPT" -gt 1 ]; then
              EXTRA_FLAGS="--refresh-dependencies"
            fi
            if ./gradlew $GRADLE_TASKS --stacktrace $EXTRA_FLAGS \
              -Dorg.gradle.internal.repository.max.retries=6 \
              -Dorg.gradle.internal.repository.initial.backoff=2000; then
              SUCCESS=true
              break
            fi
            if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
              echo "::warning::Gradle Release build failed (attempt $ATTEMPT/$MAX_ATTEMPTS). Waiting ${BACKOFF_SEC}s before retry..."
              sleep "$BACKOFF_SEC"
              BACKOFF_SEC=$((BACKOFF_SEC * 2))
            fi
            ATTEMPT=$((ATTEMPT + 1))
          done
          ./gradlew --stop || true
          if [ "$SUCCESS" != "true" ]; then
            echo "::error::Release build failed after $MAX_ATTEMPTS attempts."
            exit 1
          fi

      - name: Verify Signed Release APKs (aapt2, zipalign, apksigner V2+V3)
        run: |
          APP_RELEASE_APK=$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)
          WEAR_RELEASE_APK=$(find android/wear/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)

          for APK in "$APP_RELEASE_APK" "$WEAR_RELEASE_APK"; do
            if [ -z "$APK" ] || [ ! -s "$APK" ]; then
              echo "::error::Release APK was not generated."
              exit 1
            fi

            "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" >/tmp/badging-rel.log || {
              cat /tmp/badging-rel.log
              exit 1
            }
            head -n 5 /tmp/badging-rel.log

            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$APK" >/tmp/zipalign-rel.log || {
              tail -n 25 /tmp/zipalign-rel.log
              exit 1
            }
            tail -n 5 /tmp/zipalign-rel.log

            APKSIGNER_OUT=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK")
            printf '%s\n' "$APKSIGNER_OUT"

            printf '%s\n' "$APKSIGNER_OUT" | grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" || {
              echo "::error::Release APK ($APK) missing V2 scheme."
              exit 1
            }
            printf '%s\n' "$APKSIGNER_OUT" | grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" || {
              echo "::error::Release APK ($APK) missing V3 scheme."
              exit 1
            }
          done

          {
            echo "### Release Build Summary (${SIGNING_MODE_LABEL})"
            echo "- Mobile Release APK: \`$(basename "$APP_RELEASE_APK")\` ($(du -h "$APP_RELEASE_APK" | cut -f1))"
            echo "- Wear OS Release APK: \`$(basename "$WEAR_RELEASE_APK")\` ($(du -h "$WEAR_RELEASE_APK" | cut -f1))"
            echo "- Verified R8 minification, \`zipalign -c -v 4\`, and \`apksigner\` V2+V3."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Mobile Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MuslimPlus-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Wear OS Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MuslimPlus-Wear-Release-APK
          path: android/wear/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Release App Bundle (AAB) Artifact
        if: inputs.build_aab != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: MuslimPlus-Release-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
