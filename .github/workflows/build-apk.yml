name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Installable Android APK (Debug & Release)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew android/gradlew

      - name: Print Build Environment & Android Directory Structure
        run: |
          env | grep -E '^(ANDROID_|JAVA_|GRADLE_|GITHUB_|RUNNER_|CI)' | sort || true
          find android -maxdepth 4 -print | sort

      - name: Run Android JUnit Tests & Build Both APKs (Debug & Release)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "Release keystore secret detected. Decoding keystore..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release-keystore.jks
            export KEYSTORE_FILE="$PWD/android/app/release-keystore.jks"
          else
            echo "No release keystore secret provided. Creating fallback keystore for signed Release APK..."
            mkdir -p "$HOME/.android"
            keytool -genkey -v -keystore "$HOME/.android/release.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Release,O=Android,C=US" -noprompt 2>/dev/null || true
            export KEYSTORE_FILE="$HOME/.android/release.keystore"
            export KEYSTORE_PASSWORD="android"
            export KEY_ALIAS="androiddebugkey"
            export KEY_PASSWORD="android"
          fi
          ./gradlew testDebugUnitTest assembleDebug assembleRelease --build-cache --stacktrace

      - name: Upload Debug APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AlMoazen-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Release APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AlMoazen-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
