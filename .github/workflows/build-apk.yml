name: Build Android Native App (APK & AAB)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    name: Build Native Android APK & AAB (Debug & Release)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Licenses & Install Android SDK Components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "cmdline-tools;latest" "platform-tools" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" || true

      - name: Grant execute permission for gradlew
        run: |
          chmod +x gradlew android/gradlew || true

      - name: Configure Release Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "Decoding release keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/release.keystore"
            echo "KEYSTORE_FILE=$HOME/.android/release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD:-android}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${KEY_ALIAS:-androiddebugkey}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${KEY_PASSWORD:-android}" >> "$GITHUB_ENV"
          else
            echo "Creating deterministic signing keystore for automated release builds..."
            keytool -genkey -v -keystore "$HOME/.android/release.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=AlMoazen Release,O=AlMoazen,C=SA" -noprompt 2>/dev/null || true
            echo "KEYSTORE_FILE=$HOME/.android/release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=androiddebugkey" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=android" >> "$GITHUB_ENV"
          fi

      - name: Run JUnit Tests & Build Native Android APK & AAB
        run: |
          ./gradlew testDebugUnitTest assembleDebug assembleRelease bundleRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AlMoazen-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AlMoazen-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Release Android App Bundle (AAB for Google Play)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AlMoazen-Release-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
