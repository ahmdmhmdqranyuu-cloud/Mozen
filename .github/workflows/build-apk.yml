name: Build Muslim Plus Android APK & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create/update a GitHub Release with verified Debug APK, Release APK, and Release AAB attached'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test-debug:
    name: Unit Tests, Lint & Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle & Android Wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle.properties') }}
          restore-keys: |
            gradle-android-${{ runner.os }}-

      - name: Set up Android SDK 36 (Command-line Tools & Build Tools 36.0.0)
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            SDK_ROOT="$HOME/android-sdk"
            mkdir -p "$SDK_ROOT"
          fi
          if [ ! -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -fsSL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
            unzip -q -o /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-extract
            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            mv /tmp/cmdline-tools-extract/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            rm -rf /tmp/cmdline-tools.zip /tmp/cmdline-tools-extract
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          set -o pipefail
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Grant execute permission for gradlew
        run: |
          chmod +x gradlew android/gradlew

      - name: Run Unit Tests, Strict Lint & Assemble Debug APK (with HTTP 429 Retry)
        working-directory: android
        run: |
          MAX_ATTEMPTS=4
          BACKOFF_SEC=15
          ATTEMPT=1
          SUCCESS=false
          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            echo "=== Gradle Debug build attempt $ATTEMPT/$MAX_ATTEMPTS ==="
            if ./gradlew testDebugUnitTest lint assembleDebug --stacktrace \
              -Dorg.gradle.internal.repository.max.retries=6 \
              -Dorg.gradle.internal.repository.initial.backoff=2000; then
              SUCCESS=true
              break
            fi
            if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
              echo "::warning::Gradle failed (attempt $ATTEMPT/$MAX_ATTEMPTS). Waiting ${BACKOFF_SEC}s before retry..."
              sleep "$BACKOFF_SEC"
              BACKOFF_SEC=$((BACKOFF_SEC * 2))
            fi
            ATTEMPT=$((ATTEMPT + 1))
          done
          ./gradlew --stop || true
          if [ "$SUCCESS" != "true" ]; then
            echo "::error::Debug unit tests, lint, or assembleDebug failed after $MAX_ATTEMPTS attempts."
            exit 1
          fi

      - name: Verify Debug APK Alignment & Debug Signature
        run: |
          DEBUG_APK=$(find android/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)
          if [ -z "$DEBUG_APK" ] || [ ! -s "$DEBUG_APK" ]; then
            echo "::error::Debug APK was not generated."
            exit 1
          fi
          ls -lh "$DEBUG_APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$DEBUG_APK" | head -n 5
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$DEBUG_APK" >/tmp/zipalign-debug.log || {
            tail -n 25 /tmp/zipalign-debug.log
            exit 1
          }
          tail -n 5 /tmp/zipalign-debug.log
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$DEBUG_APK"
          {
            echo "### Debug Build Verification"
            echo "- Debug APK: \`$(basename "$DEBUG_APK")\` ($(du -h "$DEBUG_APK" | cut -f1))"
            echo "- Unit tests (\`testDebugUnitTest\`), strict \`lint\`, \`zipalign -c -v 4\`, and \`apksigner verify\` passed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MuslimPlus-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  build-and-verify-release:
    name: Build & Verify Official Release APK + AAB
    needs: build-and-test-debug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle & Android Wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle.properties') }}
          restore-keys: |
            gradle-android-${{ runner.os }}-

      - name: Set up Android SDK 36 (Command-line Tools & Build Tools 36.0.0)
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            SDK_ROOT="$HOME/android-sdk"
            mkdir -p "$SDK_ROOT"
          fi
          if [ ! -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -fsSL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
            unzip -q -o /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-extract
            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            mv /tmp/cmdline-tools-extract/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            rm -rf /tmp/cmdline-tools.zip /tmp/cmdline-tools-extract
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          set -o pipefail
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Grant execute permission for gradlew
        run: |
          chmod +x gradlew android/gradlew

      - name: Configure & Validate Official Release Keystore
        env:
          SECRET_KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          SECRET_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          MISSING=()
          if [ -z "${SECRET_KEYSTORE_FILE:-}" ] && [ -z "${SECRET_KEYSTORE_BASE64:-}" ]; then
            MISSING+=("KEYSTORE_FILE or KEYSTORE_BASE64")
          fi
          [ -z "${KEYSTORE_PASSWORD:-}" ] && MISSING+=("KEYSTORE_PASSWORD")
          [ -z "${KEY_ALIAS:-}" ] && MISSING+=("KEY_ALIAS")
          [ -z "${KEY_PASSWORD:-}" ] && MISSING+=("KEY_PASSWORD")

          if [ "${#MISSING[@]}" -gt 0 ]; then
            {
              echo "### تعذر بناء Release APK/AAB الرسمي"
              echo "لم يتم توفير أسرار التوقيع الرسمي المطلوبة في GitHub Secrets: \`${MISSING[*]}\`."
              echo "- التوقيع بمفتاح Debug معطّل نهائيًا لحزم Release."
              echo "- يمكنك تنزيل نسخة \`MuslimPlus-Debug-APK\` من الوظيفة السابقة أو إضافة الأسرار الأربعة لإنتاج Release موقّع رسميًا."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Missing official Release signing secret(s): ${MISSING[*]}. Debug fallback signing is strictly disabled."
            exit 1
          fi

          mkdir -p "$HOME/.android"
          KEYSTORE_OUT="$HOME/.android/release.keystore"

          if [ -n "${SECRET_KEYSTORE_FILE:-}" ] && [ -f "$SECRET_KEYSTORE_FILE" ]; then
            cp "$SECRET_KEYSTORE_FILE" "$KEYSTORE_OUT"
          else
            export RAW_KS_PAYLOAD="${SECRET_KEYSTORE_FILE:-${SECRET_KEYSTORE_BASE64:-}}"
            export KEYSTORE_OUT
            python3 -c 'import base64, os, re; raw = os.environ["RAW_KS_PAYLOAD"].strip(); raw = raw.split(";base64,", 1)[1] if raw.startswith("data:") and ";base64," in raw else raw; cleaned = re.sub(r"\s+", "", raw); cleaned += "=" * ((-len(cleaned)) % 4); open(os.environ["KEYSTORE_OUT"], "wb").write(base64.urlsafe_b64decode(cleaned) if ("-" in cleaned or "_" in cleaned) else base64.b64decode(cleaned, validate=False))'
          fi

          if [ ! -s "$KEYSTORE_OUT" ]; then
            echo "::error::Decoded release keystore file is empty."
            exit 1
          fi

          if ! KEYTOOL_INFO=$(keytool -list -v -keystore "$KEYSTORE_OUT" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>&1); then
            echo "::error::keytool failed to validate keystore credentials/alias."
            printf '%s\n' "$KEYTOOL_INFO" | head -n 20
            exit 1
          fi

          if printf '%s' "$KEYTOOL_INFO" | grep -qi "CN=Android Debug"; then
            echo "::error::Android Debug keystore is forbidden for Release builds."
            exit 1
          fi

          echo "KEYSTORE_FILE=$KEYSTORE_OUT" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build Signed Release APK (R8) & Release AAB (with HTTP 429 Retry)
        working-directory: android
        run: |
          MAX_ATTEMPTS=4
          BACKOFF_SEC=15
          ATTEMPT=1
          SUCCESS=false
          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            echo "=== Gradle Release build attempt $ATTEMPT/$MAX_ATTEMPTS ==="
            if ./gradlew assembleRelease bundleRelease --stacktrace \
              -Dorg.gradle.internal.repository.max.retries=6 \
              -Dorg.gradle.internal.repository.initial.backoff=2000; then
              SUCCESS=true
              break
            fi
            if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
              echo "::warning::Gradle Release build failed (attempt $ATTEMPT/$MAX_ATTEMPTS). Waiting ${BACKOFF_SEC}s before retry..."
              sleep "$BACKOFF_SEC"
              BACKOFF_SEC=$((BACKOFF_SEC * 2))
            fi
            ATTEMPT=$((ATTEMPT + 1))
          done
          ./gradlew --stop || true
          if [ "$SUCCESS" != "true" ]; then
            echo "::error::assembleRelease / bundleRelease failed after $MAX_ATTEMPTS attempts."
            exit 1
          fi

      - name: Verify Release APK (aapt2, zipalign, apksigner V1+V2+V3) & Release AAB (jarsigner)
        run: |
          RELEASE_APK=$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)
          RELEASE_AAB=$(find android/app/build/outputs/bundle/release -maxdepth 1 -name '*.aab' | head -n 1)

          if [ -z "$RELEASE_APK" ] || [ ! -s "$RELEASE_APK" ]; then
            echo "::error::Release APK was not generated."
            exit 1
          fi
          if [ -z "$RELEASE_AAB" ] || [ ! -s "$RELEASE_AAB" ]; then
            echo "::error::Release AAB was not generated."
            exit 1
          fi

          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$RELEASE_APK" | head -n 5
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$RELEASE_APK" >/tmp/zipalign-release.log || {
            echo "::error::Release APK zipalign verification failed."
            tail -n 25 /tmp/zipalign-release.log
            exit 1
          }
          tail -n 5 /tmp/zipalign-release.log

          APKSIGNER_OUT=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$RELEASE_APK")
          printf '%s\n' "$APKSIGNER_OUT"

          printf '%s\n' "$APKSIGNER_OUT" | grep -q "Verified using v1 scheme (JAR signing): true" || {
            echo "::error::Release APK is missing V1 signing scheme."
            exit 1
          }
          printf '%s\n' "$APKSIGNER_OUT" | grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" || {
            echo "::error::Release APK is missing V2 signing scheme."
            exit 1
          }
          printf '%s\n' "$APKSIGNER_OUT" | grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" || {
            echo "::error::Release APK is missing V3 signing scheme."
            exit 1
          }
          if printf '%s' "$APKSIGNER_OUT" | grep -qi "CN=Android Debug"; then
            echo "::error::Release APK must NEVER be signed with Android Debug certificate."
            exit 1
          fi

          JARSIGNER_OUT=$(jarsigner -verify -verbose -certs "$RELEASE_AAB")
          printf '%s\n' "$JARSIGNER_OUT" | tail -n 15
          printf '%s\n' "$JARSIGNER_OUT" | grep -q "jar verified." || {
            echo "::error::Release AAB signature verification failed."
            exit 1
          }
          if printf '%s' "$JARSIGNER_OUT" | grep -qi "CN=Android Debug"; then
            echo "::error::Release AAB must NEVER be signed with Android Debug certificate."
            exit 1
          fi

          RELEASE_SIZE=$(du -h "$RELEASE_APK" | cut -f1)
          AAB_SIZE=$(du -h "$RELEASE_AAB" | cut -f1)
          echo "RELEASE_APK_PATH=$RELEASE_APK" >> "$GITHUB_ENV"
          echo "RELEASE_AAB_PATH=$RELEASE_AAB" >> "$GITHUB_ENV"
          {
            echo "### Official Release Verification"
            echo "- Release APK: \`$(basename "$RELEASE_APK")\` ($RELEASE_SIZE) — R8 minified/shrunk, \`zipalign -c -v 4\` passed, \`apksigner\` V1+V2+V3 verified."
            echo "- Release AAB: \`$(basename "$RELEASE_AAB")\` ($AAB_SIZE) — \`jarsigner -verify\` passed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MuslimPlus-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Signed Release AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MuslimPlus-Release-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Download Verified Debug APK for Release Notes Bundle
        if: startsWith(github.ref, 'refs/tags/') || inputs.create_release == 'true'
        uses: actions/download-artifact@v4
        with:
          name: MuslimPlus-Debug-APK
          path: /tmp/debug-artifact

      - name: Publish GitHub Release with Verified Official Release APK, AAB & Debug APK
        if: startsWith(github.ref, 'refs/tags/') || inputs.create_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="build-${GITHUB_RUN_NUMBER}"
          fi

          DEBUG_APK_PATH=$(find /tmp/debug-artifact -maxdepth 2 -name '*.apk' | head -n 1)
          FILES_TO_UPLOAD=("$RELEASE_APK_PATH" "$RELEASE_AAB_PATH")
          if [ -n "$DEBUG_APK_PATH" ] && [ -s "$DEBUG_APK_PATH" ]; then
            FILES_TO_UPLOAD+=("$DEBUG_APK_PATH")
          fi

          NOTES="تم بناء تطبيق مسلم بلس والتحقق من التوقيع الرسمي (V1+V2+V3) والمحاذاة (zipalign) لكل من Release APK و Release AAB بالإضافة إلى نسخة Debug للاختبار."

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${FILES_TO_UPLOAD[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${FILES_TO_UPLOAD[@]}" \
              --title "Muslim Plus Android ($TAG_NAME)" \
              --notes "$NOTES"
          fi
