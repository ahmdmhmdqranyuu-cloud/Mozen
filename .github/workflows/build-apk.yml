name: Build Android Native App (APK Only)

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      ci_test_sign_release:
        description: 'Sign Release APK with debug key for test installation when Release Keystore secrets are absent'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  build-android:
    name: Build Native Android Debug & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK 36 (Command-line Tools & Build Tools 36.0.0)
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            SDK_ROOT="$HOME/android-sdk"
            mkdir -p "$SDK_ROOT"
          fi
          if [ ! -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -fsSL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
            unzip -q -o /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-extract
            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            mv /tmp/cmdline-tools-extract/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            rm -rf /tmp/cmdline-tools.zip /tmp/cmdline-tools-extract
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          set -o pipefail
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Grant execute permission for gradlew
        run: |
          chmod +x gradlew android/gradlew

      - name: Configure Release Signing Keystore (from GitHub Secrets if provided)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          MANUAL_TEST_SIGN: ${{ inputs.ci_test_sign_release || 'false' }}
        run: |
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            if [ -z "${KEYSTORE_PASSWORD:-}" ] || [ -z "${KEY_ALIAS:-}" ] || [ -z "${KEY_PASSWORD:-}" ]; then
              echo "Error: KEYSTORE_BASE64 is set, so KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD secrets must all be provided."
              exit 1
            fi
            mkdir -p "$HOME/.android"
            echo "$KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/release.keystore"
            if [ ! -s "$HOME/.android/release.keystore" ]; then
              echo "Error: Decoded release keystore is empty."
              exit 1
            fi
            echo "KEYSTORE_FILE=$HOME/.android/release.keystore" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "RELEASE_SIGNED=true" >> "$GITHUB_ENV"
            echo "CI_SIGN_RELEASE_WITH_DEBUG=false" >> "$GITHUB_ENV"
          elif [ "$MANUAL_TEST_SIGN" = "true" ]; then
            echo "::notice::Release Keystore secrets not found; signing Release APK with debug key as requested for manual testing."
            echo "RELEASE_SIGNED=test" >> "$GITHUB_ENV"
            echo "CI_SIGN_RELEASE_WITH_DEBUG=true" >> "$GITHUB_ENV"
          else
            echo "::notice::KEYSTORE_BASE64 secret is not configured. Release APK will be built unsigned without generating a temporary/default keystore."
            echo "RELEASE_SIGNED=false" >> "$GITHUB_ENV"
            echo "CI_SIGN_RELEASE_WITH_DEBUG=false" >> "$GITHUB_ENV"
          fi

      - name: Run JUnit Tests, Lint & Build Native Android APK (Debug & Release R8)
        working-directory: android
        run: |
          ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --stacktrace

      - name: Verify Debug & Release APK Outputs
        run: |
          DEBUG_APK=$(find android/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)
          RELEASE_APK=$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)
          if [ -z "$DEBUG_APK" ] || [ ! -s "$DEBUG_APK" ]; then
            echo "Error: Debug APK was not generated."
            exit 1
          fi
          if [ -z "$RELEASE_APK" ] || [ ! -s "$RELEASE_APK" ]; then
            echo "Error: Release APK was not generated."
            exit 1
          fi
          ls -lh "$DEBUG_APK" "$RELEASE_APK"
          DEBUG_SIZE=$(du -h "$DEBUG_APK" | cut -f1)
          RELEASE_SIZE=$(du -h "$RELEASE_APK" | cut -f1)
          echo "DEBUG_APK_NAME=$(basename "$DEBUG_APK")" >> "$GITHUB_ENV"
          echo "RELEASE_APK_NAME=$(basename "$RELEASE_APK")" >> "$GITHUB_ENV"
          echo "DEBUG_APK_SIZE=$DEBUG_SIZE" >> "$GITHUB_ENV"
          echo "RELEASE_APK_SIZE=$RELEASE_SIZE" >> "$GITHUB_ENV"
          DEBUG_BADGING=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$DEBUG_APK")
          printf '%s\n' "$DEBUG_BADGING" | head -n 5
          RELEASE_BADGING=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$RELEASE_APK")
          printf '%s\n' "$RELEASE_BADGING" | head -n 5
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$DEBUG_APK"
          if [ "${RELEASE_SIGNED:-false}" = "true" ] || [ "${RELEASE_SIGNED:-false}" = "test" ]; then
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$RELEASE_APK"
          fi

      - name: Write Build & Install Instructions Summary
        if: always()
        run: |
          {
            echo "## نتائج بناء ملفات APK"
            echo "- **AlMoazen-Debug-APK (\`${DEBUG_APK_NAME:-AlMoazen-debug.apk}\` — ${DEBUG_APK_SIZE:-unknown})**: موقّع وجاهز للتثبيت مباشرة على الهاتف."
            if [ "${RELEASE_SIGNED:-false}" = "true" ]; then
              echo "- **AlMoazen-Release-APK (\`${RELEASE_APK_NAME:-AlMoazen-release.apk}\` — ${RELEASE_APK_SIZE:-unknown})**: مضغوط بتقنية R8 وموقّع بمفتاح الإصدار الحقيقي من GitHub Secrets."
            elif [ "${RELEASE_SIGNED:-false}" = "test" ]; then
              echo "- **AlMoazen-Release-APK (\`${RELEASE_APK_NAME:-AlMoazen-release.apk}\` — ${RELEASE_APK_SIZE:-unknown})**: مضغوط بتقنية R8 وموقّع تجريبياً بمفتاح التطوير للاختبار على الهاتف."
            else
              echo "- **Release APK (\`${RELEASE_APK_NAME:-AlMoazen-release.apk}\` — ${RELEASE_APK_SIZE:-unknown})**: تم بناؤه وضغطه بـ R8، ولم يتم رفعه لأنه غير موقّع (أضف أسرار التوقيع الحقيقية أو اختر \`ci_test_sign_release: true\` عند التشغيل اليدوي)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Debug APK (Signed & Installable)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AlMoazen-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK (Signed)
        uses: actions/upload-artifact@v4
        if: success() && (env.RELEASE_SIGNED == 'true' || env.RELEASE_SIGNED == 'test')
        with:
          name: AlMoazen-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
