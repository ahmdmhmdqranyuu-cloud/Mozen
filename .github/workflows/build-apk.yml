name: Build Muslim Plus Android & Wear OS Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create/update a GitHub Release with verified Mobile & Wear OS Release APKs attached'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test-debug:
    name: Unit Tests, Strict Lint & Debug APKs (App + Wear OS)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle & Android Wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle.properties') }}
          restore-keys: |
            gradle-android-${{ runner.os }}-

      - name: Set up Android SDK 36 (Command-line Tools & Build Tools 36.0.0)
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            SDK_ROOT="$HOME/android-sdk"
            mkdir -p "$SDK_ROOT"
          fi
          if [ ! -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -fsSL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
            unzip -q -o /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-extract
            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            mv /tmp/cmdline-tools-extract/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            rm -rf /tmp/cmdline-tools.zip /tmp/cmdline-tools-extract
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          set -o pipefail
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Grant execute permission for gradlew
        run: |
          chmod +x gradlew android/gradlew

      - name: Run Unit Tests, Strict Lint & Assemble Debug APKs (:app + :wear with HTTP 429 Retry)
        working-directory: android
        run: |
          MAX_ATTEMPTS=4
          BACKOFF_SEC=15
          ATTEMPT=1
          SUCCESS=false
          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            echo "=== Gradle Debug build attempt $ATTEMPT/$MAX_ATTEMPTS ==="
            if ./gradlew :app:testDebugUnitTest :wear:testDebugUnitTest lint :app:assembleDebug :wear:assembleDebug --stacktrace \
              -Dorg.gradle.internal.repository.max.retries=6 \
              -Dorg.gradle.internal.repository.initial.backoff=2000; then
              SUCCESS=true
              break
            fi
            if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
              echo "::warning::Gradle failed (attempt $ATTEMPT/$MAX_ATTEMPTS). Waiting ${BACKOFF_SEC}s before retry..."
              sleep "$BACKOFF_SEC"
              BACKOFF_SEC=$((BACKOFF_SEC * 2))
            fi
            ATTEMPT=$((ATTEMPT + 1))
          done
          ./gradlew --stop || true
          if [ "$SUCCESS" != "true" ]; then
            echo "::error::Debug unit tests, lint, or assembleDebug failed after $MAX_ATTEMPTS attempts."
            exit 1
          fi

      - name: Verify Debug APKs Alignment & Signature (Mobile + Wear OS)
        run: |
          APP_DEBUG_APK=$(find android/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)
          WEAR_DEBUG_APK=$(find android/wear/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)
          for APK in "$APP_DEBUG_APK" "$WEAR_DEBUG_APK"; do
            if [ -z "$APK" ] || [ ! -s "$APK" ]; then
              echo "::error::Missing expected Debug APK output."
              exit 1
            fi
            ls -lh "$APK"
            "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" >/tmp/badging-debug.log || {
              cat /tmp/badging-debug.log
              exit 1
            }
            head -n 5 /tmp/badging-debug.log
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$APK" >/tmp/zipalign-debug.log || {
              tail -n 25 /tmp/zipalign-debug.log
              exit 1
            }
            tail -n 5 /tmp/zipalign-debug.log
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          done
          {
            echo "### Debug Build Verification"
            echo "- Mobile Debug APK: \`$(basename "$APP_DEBUG_APK")\` ($(du -h "$APP_DEBUG_APK" | cut -f1))"
            echo "- Wear OS Debug APK: \`$(basename "$WEAR_DEBUG_APK")\` ($(du -h "$WEAR_DEBUG_APK" | cut -f1))"
            echo "- Unit tests (\`:app:testDebugUnitTest\`, \`:wear:testDebugUnitTest\`), strict \`lint\`, \`zipalign -c -v 4\`, and \`apksigner verify\` passed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Mobile Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MuslimPlus-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Wear OS Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MuslimPlus-Wear-Debug-APK
          path: android/wear/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  build-and-verify-release:
    name: Build & Verify Official Release APKs (App + Wear OS)
    needs: build-and-test-debug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Gradle & Android Wrapper
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-android-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties', 'android/gradle.properties') }}
          restore-keys: |
            gradle-android-${{ runner.os }}-

      - name: Set up Android SDK 36 (Command-line Tools & Build Tools 36.0.0)
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_ROOT" ]; then
            SDK_ROOT="$HOME/android-sdk"
            mkdir -p "$SDK_ROOT"
          fi
          if [ ! -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            mkdir -p "$SDK_ROOT/cmdline-tools"
            curl -fsSL --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdline-tools.zip
            unzip -q -o /tmp/cmdline-tools.zip -d /tmp/cmdline-tools-extract
            rm -rf "$SDK_ROOT/cmdline-tools/latest"
            mv /tmp/cmdline-tools-extract/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
            rm -rf /tmp/cmdline-tools.zip /tmp/cmdline-tools-extract
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          set -o pipefail
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK_ROOT" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Grant execute permission for gradlew
        run: |
          chmod +x gradlew android/gradlew

      - name: Configure & Validate Official Release Keystore
        env:
          SECRET_KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          SECRET_KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          MISSING=()
          if [ -z "${SECRET_KEYSTORE_FILE:-}" ] && [ -z "${SECRET_KEYSTORE_BASE64:-}" ]; then
            MISSING+=("KEYSTORE_FILE or KEYSTORE_BASE64")
          fi
          [ -z "${KEYSTORE_PASSWORD:-}" ] && MISSING+=("KEYSTORE_PASSWORD")
          [ -z "${KEY_ALIAS:-}" ] && MISSING+=("KEY_ALIAS")
          [ -z "${KEY_PASSWORD:-}" ] && MISSING+=("KEY_PASSWORD")

          if [ "${#MISSING[@]}" -gt 0 ]; then
            {
              echo "### تعذر بناء Release APK الرسمي"
              echo "لم يتم توفير أسرار التوقيع الرسمي المطلوبة في GitHub Secrets: \`${MISSING[*]}\`."
              echo "- التوقيع بمفتاح Debug معطّل نهائيًا لحزم Release."
              echo "- يمكنك تنزيل \`MuslimPlus-Debug-APK\` و \`MuslimPlus-Wear-Debug-APK\` من الوظيفة السابقة أو إضافة الأسرار الأربعة لإنتاج Release APK موقّع رسميًا."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::Missing official Release signing secret(s): ${MISSING[*]}. Debug fallback signing is strictly disabled."
            exit 1
          fi

          mkdir -p "$HOME/.android"
          KEYSTORE_OUT="$HOME/.android/release.keystore"

          if [ -n "${SECRET_KEYSTORE_FILE:-}" ] && [ -f "$SECRET_KEYSTORE_FILE" ]; then
            cp "$SECRET_KEYSTORE_FILE" "$KEYSTORE_OUT"
          else
            export RAW_KS_PAYLOAD="${SECRET_KEYSTORE_FILE:-${SECRET_KEYSTORE_BASE64:-}}"
            export KEYSTORE_OUT
            python3 -c 'import base64, os, re; raw = os.environ["RAW_KS_PAYLOAD"].strip(); raw = raw.split(";base64,", 1)[1] if raw.startswith("data:") and ";base64," in raw else raw; cleaned = re.sub(r"\s+", "", raw); cleaned += "=" * ((-len(cleaned)) % 4); open(os.environ["KEYSTORE_OUT"], "wb").write(base64.urlsafe_b64decode(cleaned) if ("-" in cleaned or "_" in cleaned) else base64.b64decode(cleaned, validate=False))'
          fi

          if [ ! -s "$KEYSTORE_OUT" ]; then
            echo "::error::Decoded release keystore file is empty."
            exit 1
          fi

          if ! KEYTOOL_INFO=$(keytool -list -v -keystore "$KEYSTORE_OUT" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>&1); then
            echo "::error::keytool failed to validate keystore credentials/alias."
            printf '%s\n' "$KEYTOOL_INFO" | head -n 20
            exit 1
          fi

          if printf '%s' "$KEYTOOL_INFO" | grep -qi "CN=Android Debug"; then
            echo "::error::Android Debug keystore is forbidden for Release builds."
            exit 1
          fi

          echo "KEYSTORE_FILE=$KEYSTORE_OUT" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Build Signed Release APKs (App + Wear OS, R8, with HTTP 429 Retry)
        working-directory: android
        run: |
          MAX_ATTEMPTS=4
          BACKOFF_SEC=15
          ATTEMPT=1
          SUCCESS=false
          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            echo "=== Gradle Release APK build attempt $ATTEMPT/$MAX_ATTEMPTS ==="
            if ./gradlew :app:assembleRelease :wear:assembleRelease --stacktrace \
              -Dorg.gradle.internal.repository.max.retries=6 \
              -Dorg.gradle.internal.repository.initial.backoff=2000; then
              SUCCESS=true
              break
            fi
            if [ "$ATTEMPT" -lt "$MAX_ATTEMPTS" ]; then
              echo "::warning::Gradle Release build failed (attempt $ATTEMPT/$MAX_ATTEMPTS). Waiting ${BACKOFF_SEC}s before retry..."
              sleep "$BACKOFF_SEC"
              BACKOFF_SEC=$((BACKOFF_SEC * 2))
            fi
            ATTEMPT=$((ATTEMPT + 1))
          done
          ./gradlew --stop || true
          if [ "$SUCCESS" != "true" ]; then
            echo "::error::assembleRelease failed after $MAX_ATTEMPTS attempts."
            exit 1
          fi

      - name: Verify Signed Release APKs (aapt2, zipalign, apksigner V2+V3)
        run: |
          APP_RELEASE_APK=$(find android/app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)
          WEAR_RELEASE_APK=$(find android/wear/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)

          for APK in "$APP_RELEASE_APK" "$WEAR_RELEASE_APK"; do
            if [ -z "$APK" ] || [ ! -s "$APK" ]; then
              echo "::error::Release APK was not generated."
              exit 1
            fi

            "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK" >/tmp/badging-release.log || {
              cat /tmp/badging-release.log
              exit 1
            }
            head -n 5 /tmp/badging-release.log

            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$APK" >/tmp/zipalign-release.log || {
              echo "::error::Release APK zipalign verification failed for $APK."
              tail -n 25 /tmp/zipalign-release.log
              exit 1
            }
            tail -n 5 /tmp/zipalign-release.log

            APKSIGNER_OUT=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK")
            printf '%s\n' "$APKSIGNER_OUT"

            printf '%s\n' "$APKSIGNER_OUT" | grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" || {
              echo "::error::Release APK ($APK) is missing V2 signing scheme."
              exit 1
            }
            printf '%s\n' "$APKSIGNER_OUT" | grep -q "Verified using v3 scheme (APK Signature Scheme v3): true" || {
              echo "::error::Release APK ($APK) is missing V3 signing scheme."
              exit 1
            }
            if printf '%s' "$APKSIGNER_OUT" | grep -qi "CN=Android Debug"; then
              echo "::error::Release APK ($APK) must NEVER be signed with Android Debug certificate."
              exit 1
            fi
          done

          APP_SIZE=$(du -h "$APP_RELEASE_APK" | cut -f1)
          WEAR_SIZE=$(du -h "$WEAR_RELEASE_APK" | cut -f1)
          echo "APP_RELEASE_APK_PATH=$APP_RELEASE_APK" >> "$GITHUB_ENV"
          echo "WEAR_RELEASE_APK_PATH=$WEAR_RELEASE_APK" >> "$GITHUB_ENV"
          {
            echo "### Official Release APK Verification"
            echo "- Mobile Release APK: \`$(basename "$APP_RELEASE_APK")\` ($APP_SIZE) — R8 minified/shrunk, \`zipalign -c -v 4\` passed, \`apksigner\` V2+V3 verified."
            echo "- Wear OS Release APK: \`$(basename "$WEAR_RELEASE_APK")\` ($WEAR_SIZE) — R8 minified/shrunk, \`zipalign -c -v 4\` passed, \`apksigner\` V2+V3 verified."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Signed Mobile Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MuslimPlus-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Signed Wear OS Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MuslimPlus-Wear-Release-APK
          path: android/wear/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release with Verified Official Release APKs
        if: startsWith(github.ref, 'refs/tags/') || inputs.create_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="build-${GITHUB_RUN_NUMBER}"
          fi

          FILES_TO_UPLOAD=("$APP_RELEASE_APK_PATH" "$WEAR_RELEASE_APK_PATH")
          NOTES="تم بناء حزم Release APK الرسمية لتطبيق مسلم بلس (الهاتف + ساعة Wear OS) والتحقق من التوقيع الرسمي (V2+V3) والمحاذاة (zipalign) وضغط R8."

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "${FILES_TO_UPLOAD[@]}" --clobber
          else
            gh release create "$TAG_NAME" "${FILES_TO_UPLOAD[@]}" \
              --title "Muslim Plus Release APKs ($TAG_NAME)" \
              --notes "$NOTES"
          fi
