plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.muslim.azan.wear'
    compileSdk 36

    defaultConfig {
        applicationId "com.muslim.azan.wear"
        minSdk 26
        targetSdk 36
        versionCode 12
        versionName "2.2.0"
        vectorDrawables {
            useSupportLibrary true
        }
        resourceConfigurations += ['ar', 'en']
    }

    buildFeatures {
        compose true
    }

    composeOptions {
        kotlinCompilerExtensionVersion '1.5.15'
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    def releaseKeystorePath = System.getenv("KEYSTORE_FILE")
    def releaseKeystorePassword = System.getenv("KEYSTORE_PASSWORD")
    def releaseKeyAlias = System.getenv("KEY_ALIAS")
    def releaseKeyPassword = System.getenv("KEY_PASSWORD")
    def releaseKeystoreFile = null
    if (releaseKeystorePath != null && !releaseKeystorePath.trim().isEmpty()) {
        def rawKs = new File(releaseKeystorePath.trim())
        if (rawKs.isAbsolute()) {
            releaseKeystoreFile = rawKs
        } else if (file(releaseKeystorePath.trim()).exists()) {
            releaseKeystoreFile = file(releaseKeystorePath.trim())
        } else {
            releaseKeystoreFile = rootProject.file(releaseKeystorePath.trim())
        }
    }
    def hasValidReleaseSigning = releaseKeystoreFile != null &&
            releaseKeystoreFile.exists() &&
            releaseKeystoreFile.isFile() &&
            releaseKeystoreFile.length() > 0 &&
            releaseKeystorePassword != null && !releaseKeystorePassword.isEmpty() &&
            releaseKeyAlias != null && !releaseKeyAlias.isEmpty() &&
            releaseKeyPassword != null && !releaseKeyPassword.isEmpty()

    signingConfigs {
        debug {
            enableV1Signing = true
            enableV2Signing = true
            enableV3Signing = true
        }
        if (hasValidReleaseSigning) {
            release {
                storeFile releaseKeystoreFile
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasValidReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    gradle.taskGraph.whenReady { taskGraph ->
        def releaseArtifactTasks = [
            "assembleRelease",
            "bundleRelease",
            "packageRelease",
            "packageReleaseBundle",
            "signReleaseBundle"
        ]
        def buildingReleaseArtifact = taskGraph.allTasks.any { t ->
            t.project == project && releaseArtifactTasks.any { targetName ->
                t.name.equalsIgnoreCase(targetName)
            }
        }
        if (buildingReleaseArtifact && !hasValidReleaseSigning) {
            throw new GradleException(
                "Wear OS Release signing configuration missing or invalid: KEYSTORE_FILE, KEYSTORE_PASSWORD, KEY_ALIAS, and KEY_PASSWORD environment variables must all point to a valid release keystore. Signing Release with the debug key is prohibited."
            )
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "AlMoazen-Wear-v${defaultConfig.versionName}-${variant.buildType.name}.apk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    lint {
        checkReleaseBuilds true
        abortOnError true
        warningsAsErrors false
    }

    packaging {
        resources {
            excludes += [
                '/META-INF/{AL2.0,LGPL2.1}',
                '/META-INF/INDEX.LIST',
                '/META-INF/DEPENDENCIES',
                '/META-INF/*.kotlin_module',
                '/META-INF/LICENSE*',
                '/META-INF/NOTICE*',
                'META-INF/versions/9/previous-compilation-data.bin'
            ]
        }
    }
}

configurations.all {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'

    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.25'
        force 'org.jetbrains.kotlin:kotlin-stdlib-common:1.9.25'

        eachDependency { DependencyResolveDetails details ->
            if (details.requested.group == 'org.jetbrains.kotlin') {
                if (details.requested.name == 'kotlin-stdlib-jdk7' || details.requested.name == 'kotlin-stdlib-jdk8') {
                    details.useTarget("org.jetbrains.kotlin:kotlin-stdlib:1.9.25")
                    details.because("Unified in kotlin-stdlib since Kotlin 1.8.0 to eliminate duplicate classes")
                } else if (details.requested.name.startsWith('kotlin-stdlib') || details.requested.name.startsWith('kotlin-reflect')) {
                    details.useVersion '1.9.25'
                }
            }
        }
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.25')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.activity:activity-compose:1.9.3'

    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material:material-icons-extended'

    implementation 'androidx.wear:wear:1.3.0'
    implementation 'androidx.wear.compose:compose-material:1.3.1'
    implementation 'androidx.wear.compose:compose-foundation:1.3.1'

    testImplementation 'junit:junit:4.13.2'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
