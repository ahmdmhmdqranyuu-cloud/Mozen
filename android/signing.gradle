// Centralized, non-blocking Release & Debug APK/AAB signing configuration for Muslim Plus (:app and :wear).
// Official GitHub Secrets / local environment variables are used when provided:
//   KEYSTORE_FILE, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
// If official credentials are not supplied, the build NEVER fails with a missing-password error;
// it checks for an auto-generated CI keystore or cleanly falls back to debug signing so
// `./gradlew assembleRelease` always succeeds.

ext.resolveKeystoreFile = { String rawPath ->
    if (rawPath == null || rawPath.trim().isEmpty()) {
        return null
    }
    def trimmed = rawPath.trim()
    def direct = new File(trimmed)
    if (direct.isAbsolute()) {
        return direct
    }
    def moduleRelative = project.file(trimmed)
    if (moduleRelative.exists()) {
        return moduleRelative
    }
    return rootProject.file(trimmed)
}

ext.maskSecret = { String val ->
    if (val == null || val.isEmpty()) {
        return "[NOT SET]"
    }
    return "*** [SET, length=${val.length()}]"
}

def rawKeystorePath = System.getenv("KEYSTORE_FILE") ?: (project.findProperty("KEYSTORE_FILE")?.toString())
def rawKeystorePassword = System.getenv("KEYSTORE_PASSWORD") ?: (project.findProperty("KEYSTORE_PASSWORD")?.toString())
def rawKeyAlias = System.getenv("KEY_ALIAS") ?: (project.findProperty("KEY_ALIAS")?.toString())
def rawKeyPassword = System.getenv("KEY_PASSWORD") ?: (project.findProperty("KEY_PASSWORD")?.toString())

def resolvedKeystoreFile = ext.resolveKeystoreFile(rawKeystorePath)
def hasOfficialKeystore = resolvedKeystoreFile != null &&
        resolvedKeystoreFile.exists() &&
        resolvedKeystoreFile.isFile() &&
        resolvedKeystoreFile.length() > 0 &&
        rawKeystorePassword != null && !rawKeystorePassword.isEmpty() &&
        rawKeyAlias != null && !rawKeyAlias.isEmpty() &&
        rawKeyPassword != null && !rawKeyPassword.isEmpty()

def resolvedSigningMode = hasOfficialKeystore
        ? "OFFICIAL_RELEASE_KEYSTORE"
        : "FALLBACK_NON_BLOCKING_DEBUG_SIGNING"

android {
    signingConfigs {
        debug {
            enableV1Signing = true
            enableV2Signing = true
            enableV3Signing = true
        }
        if (hasOfficialKeystore) {
            release {
                storeFile resolvedKeystoreFile
                storePassword rawKeystorePassword
                keyAlias rawKeyAlias
                keyPassword rawKeyPassword
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
            }
        }
    }

    buildTypes {
        release {
            signingConfig hasOfficialKeystore ? signingConfigs.release : signingConfigs.debug
        }
    }
}

tasks.register("printSigningEnv") {
    group = "diagnostics"
    description = "Prints signing environment variable status for ${project.path} without exposing secrets."
    doLast {
        println "================ [SigningEnv ${project.path}] ================"
        println "KEYSTORE_FILE      : ${rawKeystorePath ?: '[NOT SET]'}"
        println "Resolved Keystore  : ${resolvedKeystoreFile != null ? resolvedKeystoreFile.absolutePath : '[NONE]'} (exists=${resolvedKeystoreFile != null && resolvedKeystoreFile.exists()}, size=${resolvedKeystoreFile != null && resolvedKeystoreFile.exists() ? resolvedKeystoreFile.length() : 0} bytes)"
        println "KEYSTORE_PASSWORD  : ${maskSecret(rawKeystorePassword)}"
        println "KEY_ALIAS          : ${rawKeyAlias != null && !rawKeyAlias.isEmpty() ? rawKeyAlias : '[NOT SET]'}"
        println "KEY_PASSWORD       : ${maskSecret(rawKeyPassword)}"
        println "Active Release Mode: ${resolvedSigningMode}"
        println "=============================================================="
    }
}
